name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O gradle.zip && unzip -q gradle.zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create Gradle files
        run: |
          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\nrootProject.name = "CondominiosAres"\ninclude ":app"\n' > settings.gradle
          printf 'buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nplugins {\n    id "com.android.application" version "8.1.0" apply false\n}\n' > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create all directories
        run: |
          mkdir -p app/src/main/res/drawable-hdpi
          mkdir -p app/src/main/res/drawable-mdpi
          mkdir -p app/src/main/res/drawable-xhdpi
          mkdir -p app/src/main/res/drawable-xxhdpi
          mkdir -p app/src/main/res/drawable-xxxhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/java/com/inversionesares/condominios

      - name: Download and copy icon
        run: |
          wget -q -O app/src/main/res/drawable-hdpi/ic_launcher.png https://gerencia.inversionesares2.com/condominios_app/www/img/logo_oscuro.png || \
          wget -q -O app/src/main/res/drawable-hdpi/ic_launcher.png https://cdn-icons-png.flaticon.com/512/2965/2965327.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/drawable-mdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/drawable-xhdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/drawable-xxhdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/drawable-xxxhdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp app/src/main/res/drawable-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Create app/build.gradle
        run: |
          printf 'plugins { id "com.android.application" }\nandroid {\n    namespace "com.inversionesares.condominios"\n    compileSdk 33\n    defaultConfig {\n        applicationId "com.inversionesares.condominios"\n        minSdk 21\n        targetSdk 33\n    }\n}\nrepositories {\n    google()\n    mavenCentral()\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n}\n' > app/build.gradle

      - name: Create AndroidManifest.xml
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application android:allowBackup="true" android:label="Condominios Ares" android:icon="@mipmap/ic_launcher">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/inversionesares/condominios/MainActivity.java <<-EOF
            package com.inversionesares.condominios;
            import android.app.Activity;
            import android.os.Bundle;
            import android.webkit.WebView;
            import android.webkit.WebViewClient;
            import android.webkit.WebChromeClient;
            import android.webkit.ValueCallback;
            import android.net.Uri;
            import android.content.Intent;

            public class MainActivity extends Activity {
                private WebView w;
                private ValueCallback<Uri> mUploadMessage;

                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    w = new WebView(this);
                    w.getSettings().setJavaScriptEnabled(true);
                    w.getSettings().setDomStorageEnabled(true);
                    w.getSettings().setAllowFileAccess(true);
                    w.getSettings().setAllowContentAccess(true);

                    w.setWebChromeClient(new WebChromeClient() {
                        public void openFileChooser(ValueCallback<Uri> uploadMsg) {
                            mUploadMessage = uploadMsg;
                            Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                            i.addCategory(Intent.CATEGORY_OPENABLE);
                            i.setType("image/*");
                            startActivityForResult(Intent.createChooser(i, "Seleccionar imagen"), 1);
                        }

                        @Override
                        public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                            Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                            intent.addCategory(Intent.CATEGORY_OPENABLE);
                            intent.setType("*/*");
                            startActivityForResult(intent, 2);
                            return true;
                        }
                    });

                    w.setWebViewClient(new WebViewClient());
                    w.loadUrl("https://gerencia.inversionesares2.com/condominios_app/www/");
                    setContentView(w);
                }

                @Override
                protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                    if (requestCode == 1 || requestCode == 2) {
                        if (mUploadMessage != null) {
                            Uri result = (data == null || resultCode != Activity.RESULT_OK) ? null : data.getData();
                            mUploadMessage.onReceiveValue(result);
                            mUploadMessage = null;
                        }
                    }
                }
            }
          EOF

      - name: Build APK
        run: |
          chmod +x gradle-8.2/bin/gradle
          gradle-8.2/bin/gradle -p app assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk InversionesAres2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: condominios-ares
          path: InversionesAres2.apk
